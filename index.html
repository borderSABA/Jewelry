<script src="config.js"></script><script>

function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function openModal(h){$('#modal').innerHTML=h;$('#modalBack').classList.add('show')}

async function fetchRooms(){
  const b=baseURL(); if(!b){$('#roomHint').textContent='接続先設定がありません';return}

}
function renderRooms(rooms){$('#rooms').innerHTML=rooms.map(r=>{const phase=r.phase==='game'?(r.playing?'ゲーム中':'終了後'):'ロビー';return `<div class="room-card"><h3>部屋 ${r.room}</h3><div class="room-status">${phase}<br>参加 ${r.players}/4（接続 ${r.connected}）</div><div class="room-actions"><button class="actionbtn primary" onclick="joinRoom(${r.room})">入室</button><button class="actionbtn danger" onclick="resetRoomFromTitle(${r.room})">初期化</button></div></div>`}).join('')}
async function resetRoomFromTitle(room){if(!confirm(`部屋${room}を初期化しますか？\n進行中のゲームも消えます。`))return;try{const r=await fetch(`${baseURL()}/api/room/${room}/reset`,{method:'POST'});if(!r.ok)throw new Error(await r.text());clearSession(room);await fetchRooms()}catch(e){alert(`初期化失敗: ${e.message}`)}}
function joinRoom(room){const name=($('#playerName').value||'').trim();if(!name){alert('名前を入力してください');return}if(!baseURL()){alert('接続先設定がありません');return}localStorage.setItem('splendor_name',name);ROOM=room;manualClose=false;connect(name)}
function connect(name){
  clearTimeout(reconnectTimer); const sess=loadSession(ROOM); const q=new URLSearchParams({room:String(ROOM),name}); if(sess.playerId&&sess.token){q.set('playerId',sess.playerId);q.set('token',sess.token)}
  const url=`${wsURL()}/ws?${q}`; try{WS=new WebSocket(url)}catch(e){alert('WebSocket URLが不正です');return}
  $('#connText').textContent='接続中';$('#connDot').classList.remove('on');
  WS.onopen=()=>{$('#connText').textContent='接続済み';$('#connDot').classList.add('on')};
  WS.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch{return}if(m.type==='welcome'){MY_ID=m.playerId;saveSession(ROOM,{playerId:m.playerId,token:m.token,name});return}if(m.type==='error'){toast(m.message);return}if(m.type==='update'){queue.push(m);processQueue()}};
  WS.onclose=e=>{$('#connText').textContent='切断';$('#connDot').classList.remove('on');if(e.code===4001){clearSession(ROOM);S=null;$('#lobbyScreen').classList.remove('show');$('#startScreen').style.display='flex';fetchRooms();alert('部屋が初期化されました');return}if(!manualClose&&ROOM){reconnectTimer=setTimeout(()=>connect(localStorage.getItem('splendor_name')||name),1800)}};
}
function processQueue(){if(processing||!queue.length)return;processing=true;const m=queue.shift();S=m.state;renderAll();if(m.event?.scoreGain)showScorePopup(m.event.playerName,m.event.scoreGain);const delay=m.event&&m.event.kind!=='turn'?520:120;setTimeout(()=>{processing=false;processQueue()},delay)}
function send(type,data={}){if(!WS||WS.readyState!==1){toast('サーバーに接続されていません');return}WS.send(JSON.stringify({type,...data}))}
function renderAll(){if(!S)return;ROOM=S.room;$('#roomTag').textContent=`部屋 ${ROOM}`;if(S.phase==='lobby'){renderLobby();return}$('#startScreen').style.display='none';$('#lobbyScreen').classList.remove('show');renderGame()}
function renderLobby(){
  $('#startScreen').style.display='none';$('#lobbyScreen').classList.add('show');const host=S.ownerId===MY_ID;$('#lobbyRoom').textContent=`部屋 ${S.room}`;$('#lobbyBadge').textContent=host?'あなたがホスト':'ホスト待ち';
  $('#lobbyPlayers').innerHTML=S.players.map(p=>`<div class="lobby-player"><b>${escapeHtml(p.name)}</b>${p.id===S.ownerId?'<span class="host">HOST</span>':''}${p.cpu?'<span class="cpu">CPU</span>':''}<span class="conn">${p.cpu?'CPU':p.connected?'接続中':'切断中'}</span>${host&&p.cpu?`<button class="actionbtn" style="flex:0 0 auto;padding:6px 9px" onclick="send('remove_cpu',{playerId:'${p.id}'})">削除</button>`:''}</div>`).join('');
  $('#hostControls').classList.toggle('hidden',!host);$('#startGameBtn').disabled=!host||S.players.length<2;$('#addCpuBtn').disabled=!host||S.players.length>=4;
}
function leaveLobby(){manualClose=true;send('leave');setTimeout(()=>{try{WS?.close()}catch{};S=null;ROOM=0;$('#lobbyScreen').classList.remove('show');$('#startScreen').style.display='flex';fetchRooms()},150)}
function gemMini(c,n){return `<span class="mini-gem"><span class="dot" style="background:${HEX[c]}"></span>${n}</span>`}
function reqHtml(o){return COLORS.filter(c=>o[c]>0).map(c=>`<span class="req ${c}" style="background:${HEX[c]}">${o[c]}</span>`).join('')}
function canAffordYou(card){if(!S?.you)return false;let d=0;for(const c of COLORS)d+=Math.max(0,card.cost[c]-S.you.bonus[c]-S.you.tokens[c]);return d<=S.you.tokens.gold}
function cardHtml(card,zone='face'){if(!card)return'<div></div>';const afford=canAffordYou(card)&&isMyTurn()&&!S.pending;return `<div class="devcard card-bg-${card.bonus}${afford?' affordable':''}" data-card="${card.id}" data-zone="${zone}" data-level="${card.level}"><div class="card-top"><div class="card-vp">${card.vp||''}</div><div class="card-bonus" style="background:${HEX[card.bonus]}">${ICON[card.bonus]}</div></div><div class="card-level">LEVEL ${'◆'.repeat(card.level)}</div><div class="costs">${COLORS.filter(c=>card.cost[c]>0).map(c=>`<span class="cost ${c}" style="background:${HEX[c]}">${card.cost[c]}</span>`).join('')}</div></div>`}
function isMyTurn(){return S?.players?.[S.turn]?.id===MY_ID&&!S.over}
function renderGame(){
  const me=S.you;const current=S.players[S.turn];$('#turnPill').textContent=S.over?'ゲーム終了':`${current?.name||'-'}の手番 / R${S.round}`;
  $('#players').innerHTML=S.players.map((p,i)=>`<div class="player ${i===S.turn?'active':''} ${!p.connected&&!p.cpu?'disconnected':''}"><div class="player-head"><span>${escapeHtml(p.name)}</span>${p.cpu?'<span class="cpu">CPU</span>':''}<span class="score">${p.score}</span></div><div class="minirow"><span class="rowlabel">ボーナス</span>${COLORS.map(c=>gemMini(c,p.bonus[c])).join('')}</div><div class="minirow"><span class="rowlabel">所持トークン</span>${COLORS.map(c=>gemMini(c,p.tokens[c])).join('')}${gemMini('gold',p.tokens.gold)}</div><div class="pmeta"><span>購入 ${p.cardsCount}枚</span><span>予約 ${p.reservedCount}/3</span><span>貴族 ${p.noblesCount}</span></div></div>`).join('');
  $('#nobles').innerHTML=S.nobles.map(n=>`<div class="noble"><span class="crown">♛</span><span class="vp">3</span><div class="reqs">${reqHtml(n)}</div></div>`).join('')||'<div style="color:#829ba0;padding:20px">貴族は残っていません</div>';
  $('#tiers').innerHTML=[3,2,1].map(l=>`<div class="tier-row"><div class="deck" data-deck="${l}"><div class="deck-level">${'◆'.repeat(l)}</div><div class="deck-count">残り ${S.decksCount[l]}</div><div class="deck-count">クリックで予約</div></div>${S.face[l].map(c=>cardHtml(c,'face')).join('')}</div>`).join('');
  $('#tokenList').innerHTML=[...COLORS,'gold'].map(c=>`<div class="token ${c} ${(takeSel[c]||0)?'sel':''}" data-token="${c}" style="background:${HEX[c]}"><span class="gemicon">${ICON[c]}</span><span class="tname">${JP[c]}</span><span class="count">${S.bank[c]}${takeSel[c]?` <small>+${takeSel[c]}</small>`:''}</span></div>`).join('');
  $('#myScore').textContent=me?.score||0;$('#myBonus').innerHTML=COLORS.map(c=>gemMini(c,me?.bonus?.[c]||0)).join('');$('#myGems').innerHTML=COLORS.map(c=>gemMini(c,me?.tokens?.[c]||0)).join('')+gemMini('gold',me?.tokens?.gold||0);$('#reserveCount').textContent=`${me?.reservedCount||0}/3`;$('#reservedList').innerHTML=(me?.reserved||[]).map(c=>cardHtml(c,'reserved')).join('')||'<div style="font-size:11px;color:#789098;padding:18px 4px">予約カードなし</div>';
  updateStatus();bindDynamic();renderPending();if(S.over)showGameOver();
}
function updateStatus(){if(!S||S.phase!=='game')return;const s=$('#statusMain'),sub=$('#statusSub');if(S.over){s.textContent='ゲーム終了';sub.textContent='部屋を初期化すると新しいゲームを開始できます。';return}if(S.pending?.playerId===MY_ID){s.textContent=S.pending.type==='discard'?`トークンを${S.pending.count}枚返却してください`:'訪問する貴族を選択してください';sub.textContent='この処理が終わるまで手番は進みません。';return}if(!isMyTurn()){s.textContent=`${S.players[S.turn]?.name}の手番です`;sub.textContent='相手の行動を待っています。';return}const n=Object.values(takeSel).reduce((a,b)=>a+b,0);s.textContent=n?`宝石を ${n} 枚選択中`:'あなたの手番です';sub.textContent=n?'選択内容を確認して「宝石を取る」を押してください。':'宝石取得 / 購入 / 予約 のどれか1アクションです。'}
function bindDynamic(){$$('.devcard').forEach(el=>el.onclick=()=>{if(!isMyTurn()||S.pending)return;const card=findCard(el.dataset.card,el.dataset.zone);openCardModal(card,el.dataset.zone)});$$('.deck').forEach(el=>el.onclick=()=>{if(!isMyTurn()||S.pending)return;openDeckModal(+el.dataset.deck)});$$('.token').forEach(el=>el.onclick=()=>selectToken(el.dataset.token))}
function findCard(id,zone){if(zone==='reserved')return S.you.reserved.find(c=>c.id===id);for(const l of [1,2,3]){const c=S.face[l].find(x=>x.id===id);if(c)return c}}
function openCardModal(card,zone){const aff=canAffordYou(card),rok=S.you.reservedCount<3&&zone==='face';openModal(`<h2>発展カード</h2><div class="modal-card">${cardHtml(card,zone)}</div><p>永久ボーナス：${JP[card.bonus]} ／ 威信：${card.vp}点</p><div class="modal-actions"><button class="actionbtn ok" id="mBuy" ${aff?'':'disabled'}>購入${aff?'':'（不足）'}</button>${zone==='face'?`<button class="actionbtn primary" id="mReserve" ${rok?'':'disabled'}>予約</button>`:''}<button class="actionbtn" id="mClose">戻る</button></div>`);$('#mClose').onclick=closeModal;if(aff)$('#mBuy').onclick=()=>{closeModal();send('buy',{cardId:card.id})};if(rok)$('#mReserve').onclick=()=>{closeModal();send('reserve_face',{cardId:card.id})}}
function openDeckModal(level){const ok=S.you.reservedCount<3&&S.decksCount[level]>0;openModal(`<h2>レベル${level}の山札</h2><p>一番上のカードを内容を見ずに予約します。黄金が残っていれば1枚受け取ります。</p><div class="modal-actions"><button class="actionbtn primary" id="blindRes" ${ok?'':'disabled'}>山札から予約</button><button class="actionbtn" id="mClose">戻る</button></div>`);$('#mClose').onclick=closeModal;if(ok)$('#blindRes').onclick=()=>{closeModal();send('reserve_deck',{level})}}
function selectToken(c){if(!isMyTurn()||S.pending||c==='gold'||S.bank[c]<=0)return;const vals=COLORS.filter(x=>takeSel[x]);if(takeSel[c]){if(takeSel[c]===1&&vals.length===1&&S.bank[c]>=4)takeSel[c]=2;else delete takeSel[c]}else{if(vals.some(x=>takeSel[x]===2)||vals.length>=3)return;takeSel[c]=1}renderGame()}
function validTake(){const e=COLORS.filter(c=>takeSel[c]).map(c=>[c,takeSel[c]]),total=e.reduce((s,x)=>s+x[1],0);if(e.length===1&&e[0][1]===2)return S.bank[e[0][0]]>=4;if(e.some(x=>x[1]!==1))return false;const available=COLORS.filter(c=>S.bank[c]>0).length;return total===Math.min(3,available)&&total>0}
function renderPending(){const b=$('#pendingBanner');if(!S.pending||S.pending.playerId!==MY_ID){b.classList.remove('show');return}b.classList.add('show');b.textContent=S.pending.type==='discard'?`トークンを${S.pending.count}枚返却`:'貴族を選択';if(S.pending.type==='discard')promptDiscard();if(S.pending.type==='noble')promptNoble()}
function promptDiscard(){if($('#modalBack').classList.contains('show'))return;const must=S.pending.count,p=S.you,ret={white:0,blue:0,green:0,red:0,black:0,gold:0};const draw=()=>{openModal(`<h2>トークンを${must}枚返却</h2><div class="discard-grid">${[...COLORS,'gold'].map(c=>`<div class="discard-item"><span class="dot" style="background:${HEX[c]}"></span><b>${JP[c]}</b><span style="margin-left:auto">${ret[c]}/${p.tokens[c]}</span><button data-minus="${c}">−</button><button data-plus="${c}">＋</button></div>`).join('')}</div><div class="modal-actions"><button class="actionbtn primary" id="discardOk" ${Object.values(ret).reduce((a,b)=>a+b,0)===must?'':'disabled'}>返却する</button></div>`);$$('[data-plus]').forEach(b=>b.onclick=()=>{const c=b.dataset.plus;if(ret[c]<p.tokens[c]&&Object.values(ret).reduce((a,b)=>a+b,0)<must){ret[c]++;draw()}});$$('[data-minus]').forEach(b=>b.onclick=()=>{const c=b.dataset.minus;if(ret[c]>0){ret[c]--;draw()}});if(!$('#discardOk').disabled)$('#discardOk').onclick=()=>{send('discard',{tokens:ret});$('#modalBack').classList.remove('show')}};draw()}
function promptNoble(){if($('#modalBack').classList.contains('show'))return;const choices=S.nobles.filter(n=>S.pending.choices.includes(n.id));openModal(`<h2>訪問する貴族を選択</h2><div class="choice-list">${choices.map(n=>`<div class="noble" data-noble="${n.id}"><span class="crown">♛</span><span class="vp">3</span><div class="reqs">${reqHtml(n)}</div></div>`).join('')}</div>`);$$('[data-noble]').forEach(el=>el.onclick=()=>{send('choose_noble',{nobleId:el.dataset.noble});$('#modalBack').classList.remove('show')})}
function showGameOver(){if($('#modalBack').classList.contains('show'))return;const winners=S.players.filter(p=>S.winnerIds.includes(p.id));openModal(`<div class="gameover-box"><h2>ゲーム終了</h2><div class="winner">${winners.map(x=>escapeHtml(x.name)).join('・')} の勝利</div><p>${S.players.map(p=>`<b>${escapeHtml(p.name)}</b>：${p.score}点（購入${p.cardsCount}枚）`).join('<br>')}</p><div class="modal-actions"><button class="actionbtn" id="mClose">盤面を見る</button><button class="actionbtn danger" id="resetNow">部屋を初期化</button></div></div>`);$('#mClose').onclick=()=>$('#modalBack').classList.remove('show');$('#resetNow').onclick=resetCurrentRoom}
async function resetCurrentRoom(){if(!confirm(`部屋${ROOM}を初期化しますか？`))return;await fetch(`${baseURL()}/api/room/${ROOM}/reset`,{method:'POST'})}
$('#confirmTake').onclick=()=>{if(!validTake())return toast('選び方がルールに合っていません');send('take',{tokens:takeSel});takeSel={}};$('#clearTake').onclick=()=>{takeSel={};if(S?.phase==='game')renderGame()};
$('#logBtn').onclick=()=>{const entries=S?.logs?.length?S.logs.map(x=>`<div class="log-entry">${escapeHtml(x)}</div>`).join(''):'<div class="log-entry">まだログはありません</div>';openModal(`<h2>進行ログ</h2><div class="log-modal">${entries}</div><div class="modal-actions"><button class="actionbtn primary" id="mClose">閉じる</button></div>`);$('#mClose').onclick=closeModal};
$('#ruleBtn').onclick=()=>{openModal(`<h2>基本ルール</h2><p><b>1手番1アクション：</b>異なる3色取得／同色2枚（取得前に4枚以上）／予約／購入。</p><p>予約は3枚まで、トークンは黄金を含め手番終了時10枚まで。貴族は条件達成で3点。誰かが15点以上になったラウンドの終了時にゲーム終了です。</p><div class="modal-actions"><button class="actionbtn primary" id="mClose">閉じる</button></div>`);$('#mClose').onclick=closeModal};
$('#restartBtn').onclick=resetCurrentRoom;$('#refreshRooms').onclick=fetchRooms;$('#addCpuBtn').onclick=()=>send('add_cpu');$('#startGameBtn').onclick=()=>send('start');$('#leaveLobbyBtn').onclick=leaveLobby;
window.joinRoom=joinRoom;window.resetRoomFromTitle=resetRoomFromTitle;window.send=send;
$('#playerName').value=localStorage.getItem('splendor_name')||'';fetchRooms();
</script></body></html>
